[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w2w-memory"
version = "3.0.0"
description = "Physical wafer-scale compute and vertically integrated memory architecture research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["w2w*"]
